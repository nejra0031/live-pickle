<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Club Match Board</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg: #0B3A44;
  --bg-deep: #082C34;
  --panel: #0F4A56;
  --panel-light: #125866;
  --line: #1C6577;
  --ball: #E8C547;
  --ball-dim: #C9A93E;
  --green: #2F9569;
  --green-dim: #1F6E4C;
  --coral: #E2634F;
  --ink: #F4F7F2;
  --ink-dim: #AFC6C6;
  --ink-faint: #7C9797;
  --male: #6FA8DC;
  --female: #E893B5;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; background: var(--bg); }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  background-image: radial-gradient(circle at 15% 0%, #12586655, transparent 45%);
  color: var(--ink);
  min-height: 100vh;
  padding: 20px 14px 60px;
}

.dc-root { max-width: 760px; margin: 0 auto; }

.dc-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 16px;
  border-bottom: 2px dashed var(--line);
  margin-bottom: 18px;
}
.dc-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ball);
  margin-bottom: 4px;
}
.dc-header h1 {
  font-family: 'Anton', sans-serif;
  font-weight: 400;
  font-size: 30px;
  letter-spacing: 0.01em;
  margin: 0;
  line-height: 1;
  color: var(--ink);
}
.dc-header-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-dim);
  text-align: right;
}

.dc-section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ball);
  margin: 26px 0 10px;
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.dc-section-note {
  font-family: 'Inter', sans-serif;
  text-transform: none;
  letter-spacing: normal;
  font-size: 12px;
  color: var(--ink-faint);
}

.dc-divider { border-top: 1px dashed var(--line); margin: 26px 0 0; }

.dc-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
}

.dc-card-note {
  font-size: 11.5px;
  color: var(--ink-faint);
  margin-bottom: 12px;
}

.dc-kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.dc-kpi {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 12px;
}
.dc-kpi-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  color: var(--ink);
}
.dc-kpi-label {
  font-size: 11px;
  color: var(--ink-dim);
  margin-top: 2px;
}
.dc-kpi-sub {
  font-family: 'JetBrains Mono', monospace;
  color: var(--ink-faint);
  white-space: nowrap;
}

.dc-bar-chart { display: flex; flex-direction: column; gap: 8px; }
.dc-bar-row { display: grid; grid-template-columns: 116px 1fr 34px; align-items: center; gap: 10px; }
.dc-bar-row-name {
  font-size: 12.5px;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dc-bar-track { background: var(--bg-deep); border-radius: 4px; height: 14px; overflow: hidden; }
.dc-bar-fill { height: 100%; border-radius: 4px; background: var(--ball); }
.dc-bar-val {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-dim);
  text-align: right;
}

.dc-cols {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  height: 160px;
  overflow-x: auto;
  padding-bottom: 4px;
}
.dc-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; flex: 1 0 34px; height: 100%; min-width: 34px; }
.dc-col-bar { width: 60%; min-width: 10px; background: var(--ball); border-radius: 3px 3px 0 0; cursor: default; }
.dc-col-val { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-dim); margin-bottom: 3px; }
.dc-col-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-faint); margin-top: 6px; white-space: nowrap; }

.dc-table { display: flex; flex-direction: column; }
.dc-table-head, .dc-table-row {
  display: grid;
  gap: 8px;
  padding: 8px 4px;
  align-items: center;
}
.dc-table-head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-faint); border-bottom: 1px solid var(--line); }
.dc-table-row { font-size: 13px; border-bottom: 1px solid var(--line); }
.dc-table-row:last-child { border-bottom: none; }
.dc-mono { font-family: 'JetBrains Mono', monospace; }

.dc-standings .dc-table-head, .dc-standings .dc-table-row { grid-template-columns: 1.8fr 0.55fr 0.55fr 0.7fr 0.75fr 0.85fr; }
.dc-pairs .dc-table-head, .dc-pairs .dc-table-row { grid-template-columns: 2.4fr 0.8fr 0.8fr; }
.dc-log .dc-table-head, .dc-log .dc-table-row { grid-template-columns: 0.9fr 2.4fr 0.9fr; }

.dc-rank { color: var(--ink-faint); font-family: 'JetBrains Mono', monospace; font-size: 11px; width: 18px; display: inline-block; }
.dc-winpct { color: var(--green); font-weight: 600; }
.dc-diff-pos { color: var(--green); }
.dc-diff-neg { color: var(--coral); }
.dc-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  padding: 1px 6px;
  border-radius: 100px;
  border: 1px solid var(--line);
  color: var(--ink-faint);
  margin-left: 6px;
}
.dc-badge-d { color: var(--ink-dim); border-color: var(--panel-light); }
.dc-badge-s { color: var(--coral); border-color: var(--coral); }

.dc-gender { font-size: 10px; margin-left: 3px; opacity: 0.9; display: inline-block; }
.dc-gender-m { color: var(--male); }
.dc-gender-f { color: var(--female); }

.dc-note {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  font-size: 11.5px;
  color: var(--ink-faint);
  margin-top: 10px;
  line-height: 1.4;
}

.dc-empty-inline { color: var(--ink-faint); font-size: 13px; padding: 10px 2px; }

.dc-toggle-row { text-align: center; margin-top: 10px; }
.dc-linkbtn {
  background: transparent;
  border: none;
  color: var(--ball);
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 12.5px;
  cursor: pointer;
  padding: 4px 8px;
}
.dc-linkbtn:hover { text-decoration: underline; }

.dc-footer {
  margin-top: 34px;
  padding-top: 14px;
  border-top: 2px dashed var(--line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-faint);
  text-align: center;
}

@media (max-width: 480px) {
  .dc-kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .dc-bar-row { grid-template-columns: 86px 1fr 30px; }
  .dc-standings .dc-table-head, .dc-standings .dc-table-row { grid-template-columns: 1.5fr 0.5fr 0.5fr 0.6fr 0.65fr 0.75fr; font-size: 11.5px; }
  .dc-pairs .dc-table-head, .dc-pairs .dc-table-row { font-size: 12px; }
  .dc-log .dc-table-head, .dc-log .dc-table-row { font-size: 12px; }
}
</style>
</head>

const GENDER = {"ADA ILKNUR":"F","Aaron Anthony":"M","Adam Phan":"M","Akira Takei":"M","Aleksandr":"M","Aleksei Romanenko":"M","Aleksey Shopin":"M","Alex":"M","Alex Cro":"M","Alex Petrov":"M","Andrey Grushin":"M","Anton Angler":"M","Ari":"M","Artyom Khomich":"M","Bao Le Quang":"M","Ben Stephen Gorry":"M","Bo Mun":"F","Borja":"M","Brian Beck":"M","Brittany Go":"F","Bruce Go":"M","Burberry Go":"F","CHRISTINA ELIZABETH WHEELER":"F","Chris Liew":"M","Chris etherton":"M","Clare Tran":"F","Connor Nguyen":"M","DAESUNG KIM":"M","DAMON KWON":"M","Dalton Rhone":"M","Daniel Jeppsson":"M","Daniel Pereira":"M","Daniil Ustinov":"M","Dawid Kozdraś":"M","Dawid Lewandowski":"M","Denis":"M","Diana":"F","Diep Kim":"F","Dims Btv":"M","Dinh Thanh Huyen":"F","Dmitrii Shalmiev":"M","Dmitry Zhuravlev":"M","Don Le":"M","Doohyeok Choi":"M","Doug Hitchcock":"M","Dung G":"M","Duyen Phan":"F","Edmund Bon":"M","Elliott Reed":"M","Geoffrey willem":"M","Ginger Yen":"F","Greg Collins":"M","Hiếu Nguyễn":"M","Huong (Jen) Huynh":"F","Igor Baldin":"M","Igor Klimov":"M","Ivan Emeliantsev":"M","Jake A":"M","Jakub Pomykalski":"M","Jason":"M","Jay Nomer Radana":"M","Jensen Leung":"M","John Kang":"M","Jonathan Ayrton":"M","KIMMINJAE":"M","Kayron Macon":"M","Kenny Pham":"M","Kilian Radamaker":"M","Kim Hồng Rosie":"F","Kirill":"M","Kym Chisholm":"F","Le My Tran Vu":"F","Linh Vu":"F","Maica Tembrevilla":"F","Manuel Pausch":"M","Marc Kielar":"M","Maxence zarca":"M","Michael Tran":"M","Nick Yung":"M","Nicolas M":"M","Nik Rz":"M","Nils van Veen":"M","Ninh":"M","Nya Long":"F","Petar Litchev":"M","Petrova Violetta":"F","Phil Y":"M","Quentin Piguel":"M","Quynh Anh":"F","Raj Sagar":"M","Ralph Clesca":"M","Rod Reed":"M","Roddy Rich":"M","Roderick Reed":"M","Ros":"M","Sam Murray II":"M","Sam Wright":"M","Sandy Steel":"F","Serge LI":"M","Shawn Chait":"M","Simon Absolon":"M","Simon GrY":"M","Slava Bardovsky":"M","Tatiana Gorman":"F","The Cador":"M","Thomas Nguyen":"M","Thu Vu":"F","Thuy Anh Shibu":"F","Thuy Nguyen":"F"," </script>
<script>
(function () {
  const MATCHES = MATCHES_RAW.map(m => ({ ...m, dateObj: new Date(m.date + 'T00:00:00') }));

  function fmtShort(d) {
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function genderIcon(name) {
    const g = GENDER[name];
    if (g === 'M') return '<span class="dc-gender dc-gender-m" title="Male">\u2642</span>';
    if (g === 'F') return '<span class="dc-gender dc-gender-f" title="Female">\u2640</span>';
    return '';
  }
  function nameHTML(name) {
    return esc(name) + genderIcon(name);
  }
  function signed(n, digits) {
    digits = digits == null ? 1 : digits;
    const v = n.toFixed(digits);
    return (n >= 0 ? '+' : '') + v;
  }

  // ---- derived stats -------------------------------------------------

  function computeWeeklyActivity(ms) {
    if (ms.length === 0) return [];
    const byBucket = {};
    ms.forEach(m => {
      const d = new Date(m.dateObj);
      const dow = (d.getDay() + 6) % 7; // Monday = 0
      d.setDate(d.getDate() - dow);
      const weekStart = d;
      const weekEnd = new Date(d);
      weekEnd.setDate(weekEnd.getDate() + 6);
      const sortKey = weekStart.toISOString().slice(0, 10);
      if (!byBucket[sortKey]) {
        byBucket[sortKey] = {
          sortKey,
          label: fmtShort(weekStart) + '\u2013' + fmtShort(weekEnd),
          from: weekStart,
          to: weekEnd,
          matches: 0,
        };
      }
      byBucket[sortKey].matches++;
    });
    return Object.values(byBucket).sort((a, b) => a.sortKey.localeCompare(b.sortKey));
  }

  function computeMostActive(ms, limit) {
    const counts = {};
    ms.forEach(m => [...m.team1, ...m.team2].forEach(n => { counts[n] = (counts[n] || 0) + 1; }));
    return Object.entries(counts)
      .map(([name, matches]) => ({ name, matches }))
      .sort((a, b) => b.matches - a.matches || a.name.localeCompare(b.name))
      .slice(0, limit);
  }

  function computeMostEvents(ms, limit) {
    const byPlayer = {};
    ms.forEach(m => {
      const eventKey = m.date + '|' + m.event;
      [...m.team1, ...m.team2].forEach(n => {
        (byPlayer[n] = byPlayer[n] || new Set()).add(eventKey);
      });
    });
    return Object.entries(byPlayer)
      .map(([name, set]) => ({ name, events: set.size }))
      .sort((a, b) => b.events - a.events || a.name.localeCompare(b.name))
      .slice(0, limit);
  }

  function computeStandings(ms, minPlayed, limit) {
    const rec = {};
    ms.forEach(m => {
      const t1win = m.score1 > m.score2;
      const t2win = m.score2 > m.score1;
      m.team1.forEach(n => {
        rec[n] = rec[n] || { name: n, wins: 0, losses: 0, diffSum: 0, played: 0 };
        rec[n].played++;
        rec[n].diffSum += (m.score1 - m.score2);
        if (t1win) rec[n].wins++; else if (t2win) rec[n].losses++;
      });
      m.team2.forEach(n => {
        rec[n] = rec[n] || { name: n, wins: 0, losses: 0, diffSum: 0, played: 0 };
        rec[n].played++;
        rec[n].diffSum += (m.score2 - m.score1);
        if (t2win) rec[n].wins++; else if (t1win) rec[n].losses++;
      });
    });
    return Object.values(rec)
      .map(r => ({ ...r, winPct: r.played > 0 ? Math.round((r.wins / r.played) * 100) : 0, avgDiff: r.played > 0 ? r.diffSum / r.played : 0 }))
      .filter(r => r.played >= minPlayed)
      .sort((a, b) => b.winPct - a.winPct || b.played - a.played || a.name.localeCompare(b.name))
      .slice(0, limit);
  }

  function computePartnerships(ms, minPlayed, limit, mixedOnly) {
    const t = {};
    ms.forEach(m => {
      [[m.team1, m.score1, m.score2], [m.team2, m.score2, m.score1]].forEach(([team, us, them]) => {
        if (team.length < 2) return;
        const sorted = [...team].sort();
        const key = sorted.join(' & ');
        t[key] = t[key] || { pair: key, members: sorted, matches: 0, wins: 0 };
        t[key].matches++;
        if (us > them) t[key].wins++;
      });
    });
    let list = Object.values(t)
      .map(r => ({ ...r, winPct: Math.round((r.wins / r.matches) * 100) }))
      .filter(r => r.matches >= minPlayed);
    if (mixedOnly) {
      list = list.filter(r => {
        const g = r.members.map(n => GENDER[n]);
        return g.length === 2 && ((g[0] === 'M' && g[1] === 'F') || (g[0] === 'F' && g[1] === 'M'));
      });
    }
    return list
      .sort((a, b) => b.winPct - a.winPct || b.matches - a.matches)
      .slice(0, limit);
  }

  function computeMargins(ms) {
    const buckets = { '1-2': 0, '3-4': 0, '5-6': 0, '7-8': 0, '9+': 0 };
    ms.forEach(m => {
      const d = Math.abs(m.score1 - m.score2);
      if (d <= 2) buckets['1-2']++;
      else if (d <= 4) buckets['3-4']++;
      else if (d <= 6) buckets['5-6']++;
      else if (d <= 8) buckets['7-8']++;
      else buckets['9+']++;
    });
    return Object.entries(buckets).map(([label, count]) => ({ label, count }));
  }

  // ---- render helpers --------------------------------------------------

  function barChartHTML(rows) {
    const max = Math.max(1, ...rows.map(r => r.value));
    return '<div class="dc-bar-chart">' + rows.map(r => (
      '<div class="dc-bar-row">' +
        '<div class="dc-bar-row-name" title="' + esc(r.plainName != null ? r.plainName : r.name) + '">' + r.name + '</div>' +
        '<div class="dc-bar-track"><div class="dc-bar-fill" style="width:' + Math.max(3, (r.value / max) * 100) + '%; background:' + (r.color || 'var(--ball)') + '"></div></div>' +
        '<div class="dc-bar-val">' + r.value + '</div>' +
      '</div>'
    )).join('') + '</div>';
  }

  function columnChartHTML(rows) {
    const max = Math.max(1, ...rows.map(r => r.matches));
    return '<div class="dc-cols">' + rows.map(r => (
      '<div class="dc-col">' +
        '<div class="dc-col-val">' + r.matches + '</div>' +
        '<div class="dc-col-bar" title="' + esc(r.label) + '" style="height:' + Math.max(4, (r.matches / max) * 100) + '%"></div>' +
        '<div class="dc-col-label">' + esc(r.shortLabel || r.label) + '</div>' +
      '</div>'
    )).join('') + '</div>';
  }

  // ---- build page --------------------------------------------------

  const totalMatches = MATCHES.length;
  const players = new Set();
  MATCHES.forEach(m => [...m.team1, ...m.team2].forEach(n => players.add(n)));
  const maleCount = [...players].filter(n => GENDER[n] === 'M').length;
  const femaleCount = [...players].filter(n => GENDER[n] === 'F').length;
  const sessions = new Set(MATCHES.map(m => m.date)).size;
  const doublesCount = MATCHES.filter(m => m.type === 'doubles').length;
  const singlesCount = MATCHES.filter(m => m.type === 'singles').length;

  const activity = computeWeeklyActivity(MATCHES);
  const mostActive = computeMostActive(MATCHES, 15);
  const mostEvents = computeMostEvents(MATCHES, 15);
  const standings = computeStandings(MATCHES, 10, 15);
  const partnerships = computePartnerships(MATCHES, 5, 15, false);
  const mixedPartnerships = computePartnerships(MATCHES, 5, 15, true);
  const margins = computeMargins(MATCHES);

  const sortedByDate = [...MATCHES].sort((a, b) => b.date.localeCompare(a.date));
  const firstDate = sortedByDate[sortedByDate.length - 1] ? sortedByDate[sortedByDate.length - 1].dateObj : null;
  const lastDate = sortedByDate[0] ? sortedByDate[0].dateObj : null;

  const RECENT_LIMIT = 15;

  const html = [];
  html.push('<header class="dc-header">');
  html.push('<div><div class="dc-eyebrow">Club dashboard</div><h1>Match Board</h1></div>');
  if (firstDate && lastDate) {
    html.push('<div class="dc-header-sub">' + fmtShort(firstDate) + ' \u2013 ' + fmtShort(lastDate) + '</div>');
  }
  html.push('</header>');

  html.push('<div class="dc-kpi-grid">');
  html.push('<div class="dc-kpi"><div class="dc-kpi-value">' + totalMatches + '</div><div class="dc-kpi-label">Matches logged</div></div>');
  html.push('<div class="dc-kpi"><div class="dc-kpi-value">' + players.size + '</div><div class="dc-kpi-label">Players <span class="dc-kpi-sub">(' + maleCount + '<span class="dc-gender dc-gender-m">\u2642</span> / ' + femaleCount + '<span class="dc-gender dc-gender-f">\u2640</span>)</span></div></div>');
  html.push('<div class="dc-kpi"><div class="dc-kpi-value">' + sessions + '</div><div class="dc-kpi-label">Play sessions</div></div>');
  html.push('<div class="dc-kpi"><div class="dc-kpi-value">' + doublesCount + '<span style="font-size:13px;color:var(--ink-faint)">/' + singlesCount + '</span></div><div class="dc-kpi-label">Doubles / Singles</div></div>');
  html.push('</div>');

  html.push('<div class="dc-divider"></div>');
  html.push('<div class="dc-section-label">Match activity <span class="dc-section-note">(matches per calendar week, Mon\u2013Sun \u2014 hover a bar for its date range)</span></div>');
  html.push('<div class="dc-card">' + (activity.length ? columnChartHTML(activity.map(a => ({ matches: a.matches, label: a.label, shortLabel: fmtShort(a.from) }))) : '<div class="dc-empty-inline">No matches yet.</div>') + '</div>');

  html.push('<div class="dc-divider"></div>');
  html.push('<div class="dc-section-label">Most active players <span class="dc-section-note">(top 15 by # games played)</span></div>');
  html.push('<div class="dc-card">' + barChartHTML(mostActive.map(r => ({ name: nameHTML(r.name), plainName: r.name, value: r.matches }))) + '</div>');

  html.push('<div class="dc-divider"></div>');
  html.push('<div class="dc-section-label">Most events joined <span class="dc-section-note">(top 15 by # distinct events attended)</span></div>');
  html.push('<div class="dc-card">' + barChartHTML(mostEvents.map(r => ({ name: nameHTML(r.name), plainName: r.name, value: r.events }))) + '</div>');

  html.push('<div class="dc-divider"></div>');
  html.push('<div class="dc-section-label">Standings <span class="dc-section-note">(top 15 by win % \u00b7 min. 10 games played)</span></div>');
  html.push('<div class="dc-card dc-standings">');
  html.push('<div class="dc-table-head"><span>Player</span><span>W</span><span>L</span><span>Played</span><span>Win %</span><span>Avg diff</span></div>');
  standings.forEach((r, i) => {
    const diffClass = r.avgDiff >= 0 ? 'dc-diff-pos' : 'dc-diff-neg';
    html.push(
      '<div class="dc-table-row">' +
        '<span><span class="dc-rank">' + (i + 1) + '</span>' + nameHTML(r.name) + '</span>' +
        '<span class="dc-mono">' + r.wins + '</span>' +
        '<span class="dc-mono">' + r.losses + '</span>' +
        '<span class="dc-mono">' + r.played + '</span>' +
        '<span class="dc-mono dc-winpct">' + r.winPct + '%</span>' +
        '<span class="dc-mono ' + diffClass + '">' + signed(r.avgDiff) + '</span>' +
      '</div>'
    );
  });
  if (standings.length === 0) html.push('<div class="dc-empty-inline">No players with 10+ games yet.</div>');
  html.push('</div>');

  html.push('<div class="dc-divider"></div>');
  html.push('<div class="dc-section-label">Score margins</div>');
  html.push('<div class="dc-card">' + barChartHTML(margins.map(m => ({ name: esc(m.label), value: m.count, color: 'var(--coral)' }))) + '</div>');

  html.push('<div class="dc-divider"></div>');
  html.push('<div class="dc-section-label">Top partnerships <span class="dc-section-note">(top 15 by win % \u00b7 min. 5 games together)</span></div>');
  html.push('<div class="dc-card dc-pairs">');
  if (partnerships.length) {
    html.push('<div class="dc-table-head"><span>Pair</span><span>Played</span><span>Win %</span></div>');
    partnerships.forEach(p => {
      html.push(
        '<div class="dc-table-row">' +
          '<span>' + p.members.map(nameHTML).join(' &amp; ') + '</span>' +
          '<span class="dc-mono">' + p.matches + '</span>' +
          '<span class="dc-mono">' + p.winPct + '%</span>' +
        '</div>'
      );
    });
  } else {
    html.push('<div class="dc-empty-inline">No pairs with 5+ games together yet.</div>');
  }
  html.push('</div>');

  html.push('<div class="dc-divider"></div>');
  html.push('<div class="dc-section-label">Top partnerships (mixed only) <span class="dc-section-note">(1 male + 1 female \u00b7 top 15 by win % \u00b7 min. 5 games together)</span></div>');
  html.push('<div class="dc-card dc-pairs">');
  if (mixedPartnerships.length) {
    html.push('<div class="dc-table-head"><span>Pair</span><span>Played</span><span>Win %</span></div>');
    mixedPartnerships.forEach(p => {
      html.push(
        '<div class="dc-table-row">' +
          '<span>' + p.members.map(nameHTML).join(' &amp; ') + '</span>' +
          '<span class="dc-mono">' + p.matches + '</span>' +
          '<span class="dc-mono">' + p.winPct + '%</span>' +
        '</div>'
      );
    });
  } else {
    html.push('<div class="dc-empty-inline">No mixed pairs with 5+ games together yet.</div>');
  }
  html.push('</div>');

  html.push('<div class="dc-divider"></div>');
  html.push('<div class="dc-section-label">Match log <span class="dc-section-note">(' + totalMatches + ' total)</span></div>');
  html.push('<div class="dc-card dc-log">');
  html.push('<div class="dc-table-head"><span>Date</span><span>Matchup</span><span>Score</span></div>');
  sortedByDate.forEach((m, i) => {
    const hidden = i >= RECENT_LIMIT ? ' dc-log-row-hidden' : '';
    const t1 = m.team1.map(nameHTML).join(' &amp; ');
    const t2 = m.team2.map(nameHTML).join(' &amp; ');
    const badge = m.type === 'doubles' ? '<span class="dc-badge dc-badge-d">D</span>' : '<span class="dc-badge dc-badge-s">S</span>';
    html.push(
      '<div class="dc-table-row' + hidden + '" style="' + (i >= RECENT_LIMIT ? 'display:none;' : '') + '">' +
        '<span class="dc-mono">' + fmtShort(m.dateObj) + '</span>' +
        '<span>' + t1 + ' <span style="color:var(--ink-faint)">vs</span> ' + t2 + badge + '</span>' +
        '<span class="dc-mono">' + m.score1 + '\u2013' + m.score2 + '</span>' +
      '</div>'
    );
  });
  html.push('</div>');
  if (sortedByDate.length > RECENT_LIMIT) {
    html.push('<div class="dc-toggle-row"><button class="dc-linkbtn" id="dc-log-toggle">Show all ' + sortedByDate.length + ' matches</button></div>');
  }

  html.push('<div class="dc-footer">Built from ' + totalMatches + ' logged matches \u00b7 ' + players.size + ' players \u00b7 no ratings on file, standings are win/loss only \u00b7 gender icons are best-guess from name only</div>');

  document.getElementById('root').innerHTML = html.join('');

  const toggle = document.getElementById('dc-log-toggle');
  if (toggle) {
    let expanded = false;
    toggle.addEventListener('click', () => {
      expanded = !expanded;
      document.querySelectorAll('.dc-log .dc-table-row').forEach((row, i) => {
        if (i >= RECENT_LIMIT) row.style.display = expanded ? 'grid' : 'none';
      });
      toggle.textContent = expanded ? 'Show fewer matches' : 'Show all ' + sortedByDate.length + ' matches';
    });
  }
})();
</script>
